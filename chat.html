<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --surface2: #1e1e21;
    --border: #2a2a2e;
    --accent: #c8f135;
    --accent-dim: #9db82a;
    --text: #f0f0f0;
    --text-muted: #6b6b72;
    --text-dim: #9999a4;
    --resolved: #c8f135;
    --escalated: #ff6b4a;
    --pending: #ffc44d;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(200,241,53,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,241,53,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 420px;
    height: 680px;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(200,241,53,0.05),
      0 40px 80px rgba(0,0,0,0.6),
      0 0 60px rgba(200,241,53,0.04);
  }

  /* ── Header ── */
  .header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    flex-shrink: 0;
  }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }

  .avatar svg {
    width: 18px;
    height: 18px;
    color: var(--bg);
  }

  .online-dot {
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #4ade80;
    border: 2px solid var(--surface);
  }

  .header-info {
    flex: 1;
  }

  .header-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  .header-status {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  .header-badge {
    font-size: 9px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--accent);
    background: rgba(200,241,53,0.1);
    border: 1px solid rgba(200,241,53,0.2);
    padding: 3px 8px;
    border-radius: 20px;
    text-transform: uppercase;
  }

  /* ── Messages ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  /* System message */
  .sys-msg {
    text-align: center;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    padding: 4px 0;
  }

  /* Message rows */
  .msg-row {
    display: flex;
    gap: 8px;
    animation: fadeUp 0.3s ease;
  }

  .msg-row.user { flex-direction: row-reverse; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
  }

  .msg-row.agent .msg-avatar {
    background: var(--accent);
    color: var(--bg);
  }

  .msg-row.user .msg-avatar {
    background: var(--surface2);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }

  .msg-content { max-width: 75%; display: flex; flex-direction: column; gap: 4px; }
  .msg-row.user .msg-content { align-items: flex-end; }

  .bubble {
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    line-height: 1.55;
    word-break: break-word;
  }

  .msg-row.agent .bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg-row.user .bubble {
    background: var(--accent);
    color: var(--bg);
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }

  /* Metadata pill */
  .meta-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .pill {
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 20px;
    font-family: 'Syne', sans-serif;
  }

  .pill.resolved  { background: rgba(200,241,53,0.12); color: var(--resolved); border: 1px solid rgba(200,241,53,0.2); }
  .pill.escalated { background: rgba(255,107,74,0.12); color: var(--escalated); border: 1px solid rgba(255,107,74,0.2); }
  .pill.category  { background: rgba(255,255,255,0.05); color: var(--text-dim); border: 1px solid var(--border); }
  .pill.confidence{ background: rgba(255,196,77,0.1); color: var(--pending); border: 1px solid rgba(255,196,77,0.2); }

  /* Typing indicator */
  .typing-row { display: none; }
  .typing-row.visible { display: flex; }

  .typing-bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    padding: 12px 16px;
    border-radius: var(--radius);
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30%            { transform: translateY(-4px); opacity: 1; }
  }

  /* ── Input area ── */
  .input-area {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface);
    flex-shrink: 0;
  }

  .input-wrap {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    padding: 10px 14px;
    transition: border-color 0.2s;
  }

  .input-wrap:focus-within {
    border-color: rgba(200,241,53,0.3);
    box-shadow: 0 0 0 3px rgba(200,241,53,0.05);
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    resize: none;
    line-height: 1.5;
    max-height: 80px;
    overflow-y: auto;
  }

  textarea::placeholder { color: var(--text-muted); }

  textarea::-webkit-scrollbar { width: 2px; }
  textarea::-webkit-scrollbar-thumb { background: var(--border); }

  .send-btn {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-sm);
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .send-btn:hover { background: #d4f548; transform: scale(1.04); }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { background: var(--border); cursor: not-allowed; transform: none; }

  .send-btn svg { width: 16px; height: 16px; color: var(--bg); }

  /* ── Suggestions ── */
  .suggestions {
    padding: 0 16px 12px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .suggestion {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--text-dim);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 11px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .suggestion:hover {
    border-color: rgba(200,241,53,0.3);
    color: var(--accent);
    background: rgba(200,241,53,0.05);
  }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="avatar">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
      <div class="online-dot"></div>
    </div>
    <div class="header-info">
      <div class="header-name">Support Agent</div>
      <div class="header-status">AI · Always online</div>
    </div>
    <div class="header-badge">AI-powered</div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="sys-msg">Today</div>

    <!-- Welcome message -->
    <div class="msg-row agent">
      <div class="msg-avatar">A</div>
      <div class="msg-content">
        <div class="bubble">
          Hey! 👋 I'm your AI support agent. How can I help you today?
        </div>
      </div>
    </div>

    <!-- Typing indicator -->
    <div class="msg-row agent typing-row" id="typing">
      <div class="msg-avatar">A</div>
      <div class="msg-content">
        <div class="typing-bubble">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Suggestions -->
  <div class="suggestions" id="suggestions">
    <div class="suggestion" onclick="useSuggestion(this)">Reset password</div>
    <div class="suggestion" onclick="useSuggestion(this)">Cancel subscription</div>
    <div class="suggestion" onclick="useSuggestion(this)">Payment failed</div>
    <div class="suggestion" onclick="useSuggestion(this)">Refund request</div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrap">
      <textarea
        id="input"
        placeholder="Type your message..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

</div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────
  const API_URL     = "http://localhost:8000/api/v1/message";
  const CUSTOMER_ID = "user_" + Math.random().toString(36).slice(2, 8);

  const messagesEl  = document.getElementById("messages");
  const inputEl     = document.getElementById("input");
  const sendBtn     = document.getElementById("sendBtn");
  const typingEl    = document.getElementById("typing");
  const suggestEl   = document.getElementById("suggestions");

  // ── Auto resize textarea ────────────────────────────────────────────────────
  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 80) + "px";
  }

  // ── Handle Enter key ────────────────────────────────────────────────────────
  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // ── Use suggestion chip ──────────────────────────────────────────────────────
  function useSuggestion(el) {
    inputEl.value = el.textContent;
    autoResize(inputEl);
    suggestEl.style.display = "none";
    inputEl.focus();
  }

  // ── Add message to UI ────────────────────────────────────────────────────────
  function addMessage(text, role, meta = null) {
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;

    const avatarEl = document.createElement("div");
    avatarEl.className = "msg-avatar";
    avatarEl.textContent = role === "agent" ? "A" : "U";

    const contentEl = document.createElement("div");
    contentEl.className = "msg-content";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    contentEl.appendChild(bubble);

    // Add metadata pills for agent messages
    if (meta && role === "agent") {
      const pills = document.createElement("div");
      pills.className = "meta-pill";

      if (meta.ticket_status) {
        const p = document.createElement("span");
        p.className = `pill ${meta.ticket_status}`;
        p.textContent = meta.ticket_status;
        pills.appendChild(p);
      }

      if (meta.category) {
        const p = document.createElement("span");
        p.className = "pill category";
        p.textContent = meta.category;
        pills.appendChild(p);
      }

      if (meta.confidence_score !== null && meta.confidence_score !== undefined) {
        const p = document.createElement("span");
        p.className = "pill confidence";
        p.textContent = `${Math.round(meta.confidence_score * 100)}% conf`;
        pills.appendChild(p);
      }

      if (pills.children.length > 0) {
        contentEl.appendChild(pills);
      }
    }

    row.appendChild(avatarEl);
    row.appendChild(contentEl);

    // Insert before typing indicator
    messagesEl.insertBefore(row, typingEl);
    scrollToBottom();
  }

  // ── Show / hide typing indicator ─────────────────────────────────────────────
  function setTyping(visible) {
    typingEl.classList.toggle("visible", visible);
    if (visible) scrollToBottom();
  }

  // ── Scroll to bottom ──────────────────────────────────────────────────────────
  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Send message ──────────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    // Clear input
    inputEl.value = "";
    inputEl.style.height = "auto";
    suggestEl.style.display = "none";

    // Disable send button
    sendBtn.disabled = true;

    // Add user message
    addMessage(text, "user");

    // Show typing
    setTyping(true);

    try {
      const res = await fetch(API_URL, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          customer_id: CUSTOMER_ID,
          message:     text
        })
      });

      if (!res.ok) throw new Error(`Server error: ${res.status}`);

      const data = await res.json();

      setTyping(false);
      addMessage(data.response, "agent", {
        ticket_status:   data.ticket_status,
        category:        data.category,
        confidence_score:data.confidence_score
      });

    } catch (err) {
      setTyping(false);
      addMessage(
        "Sorry, I'm having trouble connecting right now. Please try again.",
        "agent"
      );
      console.error("API error:", err);
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>
</body>
</html>
```
